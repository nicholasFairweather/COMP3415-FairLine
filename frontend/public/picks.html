<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>FairLine - My picks</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav>
        <a class="brand" href="games.html">FairLine</a>
        <a href="games.html">Games</a>
        <a href="picks.html">My picks</a>
        <span id="login-status"></span>
    </nav>

    <main>
        <h1>My picks</h1>
        <div id="picks">Loading your picks…</div>

        <p class="disclaimer">
            FairLine is a research tool only. It does not accept bets or payments, and nothing here is
            financial advice. Please gamble responsibly.
        </p>
    </main>

    <script src="common.js"></script>
    <script>
        let picks = [];
        let editingId = null;     // pick being edited
        let confirmingId = null;  // pick waiting for delete confirmation
        const messages = {};      // pick_id -> text

        function render() {
            const box = document.getElementById("picks");
            if (picks.length === 0) {
                box.innerHTML = '<div class="empty">No current saved pick. <a href="games.html">Browse games</a></div>';
                return;
            }

            box.innerHTML = picks.map((p) => {
                let extra = "";
                if (editingId === p.pick_id) {
                    extra = `
                        <div class="actions">
                            <select id="edit-team">
                                <option ${p.team_picked === p.away_team ? "selected" : ""}>${esc(p.away_team)}</option>
                                <option ${p.team_picked === p.home_team ? "selected" : ""}>${esc(p.home_team)}</option>
                            </select>
                            <input id="edit-stake" type="number" min="0" step="0.01" placeholder="Stake ($)"
                                value="${p.stake == null ? "" : Number(p.stake)}">
                            <button data-action="save" data-id="${p.pick_id}">Save</button>
                            <button data-action="cancel">Cancel</button>
                        </div>`;
                } else if (confirmingId === p.pick_id) {
                    extra = `
                        <div class="actions">
                            Delete this pick?
                            <button data-action="confirm-delete" data-id="${p.pick_id}">Confirm delete</button>
                            <button data-action="cancel">Cancel</button>
                        </div>`;
                }

                return `
                    <div class="card">
                        <div class="actions">
                            <button data-action="edit" data-id="${p.pick_id}">Edit</button>
                            <button data-action="delete" data-id="${p.pick_id}">Delete</button>
                        </div>
                        <div style="flex: 1">
                            <div class="matchup">${esc(p.away_team)} @ ${esc(p.home_team)}</div>
                            <div class="small">${formatKickoff(p.kickoff)} · Week ${p.week}</div>
                            <div class="small">
                                Your pick: <b>${esc(p.team_picked)}</b> · Odds when saved: ${formatOdds(p.odds_at_pick)}
                                · Stake: ${formatStake(p.stake)}
                            </div>
                        </div>
                        <span class="status ${esc(p.status)}">${esc(p.status)}</span>
                        ${extra}
                        ${messages[p.pick_id] ? `<p class="message">${esc(messages[p.pick_id])}</p>` : ""}
                    </div>`;
            }).join("");
        }

        function goToLogin() {
            localStorage.removeItem("token");
            location.href = "/";
        }

        // US-06: edit
        async function saveEdit(id) {
            const stakeText = document.getElementById("edit-stake").value;
            const stake = stakeText === "" ? null : Number(stakeText);
            if (stake !== null && !(stake > 0)) {
                messages[id] = "Stake must be greater than 0";
                render();
                return;
            }

            const team = document.getElementById("edit-team").value;
            const res = await api("/picks/" + id, "PUT", { team_picked: team, stake });
            if (res.status === 401) return goToLogin();
            if (res.ok) {
                picks = picks.map((p) => (p.pick_id === id ? { ...p, ...res.data.pick } : p));
                editingId = null;
                messages[id] = "Pick updated";
            } else {
                messages[id] = res.data?.error || "Could not update pick";
            }
            render();
        }

        // US-06: delete (after confirming)
        async function deletePick(id) {
            const res = await api("/picks/" + id, "DELETE");
            if (res.status === 401) return goToLogin();
            if (res.ok) {
                picks = picks.filter((p) => p.pick_id !== id);
                confirmingId = null;
            } else {
                messages[id] = res.data?.error || "Could not delete pick";
            }
            render();
        }

        document.getElementById("picks").addEventListener("click", (event) => {
            const button = event.target.closest("button[data-action]");
            if (!button) return;
            const id = Number(button.dataset.id);
            const action = button.dataset.action;

            if (action === "edit") { editingId = id; confirmingId = null; render(); }
            if (action === "delete") { confirmingId = id; editingId = null; render(); }
            if (action === "cancel") { editingId = null; confirmingId = null; render(); }
            if (action === "save") saveEdit(id);
            if (action === "confirm-delete") deletePick(id);
        });

        async function start() {
            const loggedIn = await showLoginStatus();
            if (!loggedIn) return goToLogin(); // must be logged in to view picks

            const res = await api("/picks");
            if (res.status === 401) return goToLogin();
            if (!res.ok) {
                document.getElementById("picks").innerHTML = '<div class="empty">Could not load your picks.</div>';
                return;
            }
            picks = res.data;
            render();
        }

        start();
    </script>
</body>

</html>
